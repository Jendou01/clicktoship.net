worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=ingress:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream frontend { zone frontend 64k; server web:3000 resolve; }
    upstream backend { zone backend 64k; server api:9000 resolve; }
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # Exact owner-reviewed hostname stored in a separate root-owned fragment.
        include /run/secrets/host_rule;
        auth_basic "ClickToShip private staging";
        auth_basic_user_file /run/secrets/gateway_passwords;
        limit_req zone=ingress burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        client_body_timeout 15s;
        send_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Next's generated inline scripts need a separately reviewed nonce-based CSP.
        location ~ ^/(?:horizon|telescope|_ignition|storage|\.env|vendor)(?:/|$) { return 404; }
        location ~ ^/api/v1/bulk/imports/[0-9a-f-]+/file$ {
            client_max_body_size 12m;
            include /etc/nginx/cts-fastcgi.conf;
        }
        location ~ ^/api/v1/tracking/webhooks/[0-9a-fA-F-]+$ {
            client_max_body_size 64k;
            include /etc/nginx/cts-fastcgi.conf;
        }
        location ~ ^/(?:api/|sanctum/csrf-cookie$) { include /etc/nginx/cts-fastcgi.conf; }
        # Cold Next pages load many hashed chunks. Keep authentication, use a separate bounded asset budget.
        location ^~ /_next/static/ {
            limit_req zone=assets burst=100 nodelay;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
