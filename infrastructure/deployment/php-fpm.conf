[global]
error_log = /dev/stderr
daemonize = no
[www]
listen = 9000
user = cts
group = cts
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
; Never include request URI, query, headers or raw error text in FPM access logs.
access.log = /dev/null
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
