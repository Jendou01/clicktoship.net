  /api/v1/admin/merchants/{merchant}/customs/declarations/{declaration}:
    get:
      operationId: customsPrivateReviewData
      x-required-permissions: [platform.customs.review]
      summary: Audited structured private declaration review; current MFA and independent
        platform.customs.review target grant; no public storage keys
      tags:
      - Customs
      security:
      - SessionCookie: []
      parameters:
      - name: merchant
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: declaration
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: access_grant
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private authorized structured declaration only; Cache-Control
            private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomsDetail'
                  meta:
                    type: object
                  error:
                    type: 'null'
        '403':
          description: Fresh MFA or independently approved exact merchant review grant
            missing
        '404':
          description: Declaration unavailable in this merchant
