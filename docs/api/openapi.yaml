        observations:
          type: array
          items:
            type: object
        requests:
          type: array
          items:
            type: object
        execution_enabled:
          const: false
      required:
      - shipments
      - submissions
      - observations
      - requests
      - execution_enabled
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: clicktoship-session
      description: Same-origin Sanctum session. Obtain XSRF cookie via GET /sanctum/csrf-cookie before mutations. Cookie name
        is deployment configurable.
    CsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie; mandatory for session mutations.
    BearerAuth:
      type: http
      scheme: bearer
      description: Hashed, expiring Sanctum API token, bound to one merchant and intersected with current membership permissions.

x-internal-carrier-operations:
  exposed_as_merchant_http: false
  external_enabled: false
  production_enabled: false
  response_protocol: aramex-v2-json-unverified
  evidence: docs/integrations/PHASE_6_EVIDENCE.md
  request_operations:
    CalculateRate:
      input:
        $ref: '#/components/schemas/CarrierInternalRate'
      external_enabled: false
      response_contract_verified: false
    CreateShipments:
      input:
        $ref: '#/components/schemas/CarrierInternalShipments'
      external_enabled: false
      response_contract_verified: false
    CreatePickup:
      input:
        $ref: '#/components/schemas/CarrierInternalPickup'
      external_enabled: false
      response_contract_verified: false
    CancelPickup:
      input:
        $ref: '#/components/schemas/CarrierInternalCancelPickup'
      external_enabled: false
      response_contract_verified: false
    PrintLabel:
      input:
        $ref: '#/components/schemas/CarrierInternalLabel'
      external_enabled: false
      response_contract_verified: false
    TrackShipments:
      input:
        $ref: '#/components/schemas/CarrierInternalTrackShipments'
      external_enabled: false
      response_contract_verified: false
    TrackPickup:
      input:
        $ref: '#/components/schemas/CarrierInternalTrackPickup'
      external_enabled: false
      response_contract_verified: false
    FetchCities:
      input:
        $ref: '#/components/schemas/CarrierInternalCities'
      external_enabled: false
      response_contract_verified: false
  runtime_boundary: CarrierOperations.prepare/execute; no public send endpoint; current gate blocks before transmission.
    TrackPickup and FetchCities have request evidence only. Unknown creates require separate reconciliation, never
    automatic retry.
  missing_capabilities:
  - countries
  - country-details
  - address-validation
  - postal-validation
  - city-suggestions
  - offices
  - authenticated-webhook
  - reference-lookup
  - current-response-normalization
  legacy_parser: Explicit legacy-soap-manual structure parser only, not a live SOAP transport or proof of V2 JSON
    response compatibility.
  scope: Internal prepare additionally resolves service_code from approved account-version candidates and derives
    merchant/actor/token context; none of these are public HTTP shipment commands.
