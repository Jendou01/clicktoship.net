components:
  headers:
    RequestId:
      description: Server-generated correlation identifier
      schema:
        type: string
        format: uuid
  responses:
    Throttled:
      description: Too many requests
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error400:
      description: Stateful first-party request/session required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Authentication missing, expired, invalid or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Permission denied, suspension or unverified email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Unavailable or foreign resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: No/stale merchant context, stale membership version, duplicate membership or last-owner protection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error419:
      description: Missing or invalid CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Redis-backed rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required:
      - request_id
      properties:
        request_id:
          type: string
          format: uuid
    Checks:
      type: object
      additionalProperties: false
      required:
      - database
      - redis
      - schema
      properties:
        database:
          type: boolean
        redis:
          type: boolean
        schema:
          type: boolean
    LiveResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: object
          required:
          - status
          additionalProperties: false
          properties:
            status:
              const: live
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - status
          - checks
          properties:
            status:
              const: ready
            checks:
              $ref: '#/components/schemas/Checks'
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: object
          required:
          - code
          - message
          - details
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    ReadinessError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - properties:
          error:
            properties:
              code:
                const: DEPENDENCIES_UNAVAILABLE
              details:
                type: object
                required:
                - checks
                properties:
                  checks:
                    $ref: '#/components/schemas/Checks'
    User:
      type: object
      properties:
        id: *id003
        name: *id002
        email:
          type: string
          format: email
        email_verified: *id001
        locale:
          enum:
          - en
          - ar
          type: string
      required:
      - id
      - name
      - email
      - email_verified
      - locale
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            active_merchant_id:
              type:
              - string
              - 'null'
              format: uuid
          required:
          - user
          - active_merchant_id
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
      required:
      - data
      - meta
      - error
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password: &id005
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
          description: Uppercase + lowercase + number + symbol. Never appears in URLs or logs.
        password_confirmation: *id005
        locale:
          type: string
          enum:
          - en
          - ar
        merchant_name:
          type:
          - string
          - 'null'
          maxLength: 120
      required:
      - name
      - email
      - password
      - password_confirmation
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
          format: password
          writeOnly: true
      required:
      - email
      - password
    ForgotRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    ResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          maxLength: 200
          writeOnly: true
        password: *id005
        password_confirmation: *id005
      required:
      - email
      - token
      - password
      - password_confirmation
    VerificationRequest:
      type: object
      properties:
        verification:
          type: string
          maxLength: 2048
          writeOnly: true
          description: Original relative signed URL from email fragment, sent only in this JSON body. Expires after 60 minutes;
            bound to authenticated user/email.
      required:
      - verification
    MerchantRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
      required:
      - name
    SelectMerchantRequest:
      type: object
      properties:
        merchant_id: *id003
      required:
      - merchant_id
    Merchant:
      type: object
      properties:
        id: *id003
        name: *id002
      required:
      - id
      - name
    MembershipReference:
      type: object
      properties:
        id: *id003
        name: *id002
        membership_id: *id003
        role: *id002
      required:
      - id
      - name
      - membership_id
      - role
    MerchantsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            merchants:
              type: array
              items:
                $ref: '#/components/schemas/MembershipReference'
          required:
          - merchants
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
      required:
      - data
      - meta
      - error
    CurrentMerchantResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            merchant:
              $ref: '#/components/schemas/Merchant'
            permissions:
              type: array
              items: *id002
          required:
          - merchant
          - permissions
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
      required:
      - data
      - meta
      - error
    Membership:
      type: object
      properties:
        id: *id003
        name: *id002
        email:
          type: string
          format: email
        role: *id002
        status:
          type: string
          enum:
          - active
          - suspended
          - removed
        version:
          type: integer
          minimum: 1
      required:
      - id
      - name
      - email
      - role
      - status
      - version
    TeamResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            memberships:
              type: array
              items:
                $ref: '#/components/schemas/Membership'
            pagination:
              type: object
              properties:
                page: *id004
                pages: *id004
                total: *id004
              required:
              - page
              - pages
              - total
          required:
          - memberships
          - pagination
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
      required:
      - data
      - meta
      - error
    TeamCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Existing verified, non-suspended registered identity. No invitation or automatic account creation.
        role:
          type: string
          description: Built-in merchant role code. Owner grants require current owner.
      required:
      - email
      - role
    TeamUpdateRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        role: *id002
        status:
          type: string
          enum:
          - active
          - suspended
          - removed
      required:
      - version
    VersionRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
      - version
    TokenRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        abilities:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items: *id002
          description: Explicit subset of current merchant permissions; wildcard/platform abilities rejected.
        current_password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      required:
      - name
      - abilities
      - current_password
    TokenCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: Displayed once; cache disabled. Store securely.
            id: *id003
            expires_at:
              type: string
              format: date-time
          required:
          - token
          - id
          - expires_at
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          type: 'null'
      required:
      - data
      - meta
      - error
    Token:
      type: object
      properties:
        id: *id003
        name: *id002
        abilities:
          type: array
          items: *id002
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - abilities
      - created_at
      - last_used_at
      - expires_at
    Session:
      type: object
      properties:
        id: *id003
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current: *id001
      required:
      - id
      - created_at
      - last_seen_at
      - expires_at
      - current
    Role:
      type: object
      properties:
        code: *id002
        name: *id002
        permissions:
          type: array
          items: *id002
      required:
      - code
      - name
      - permissions
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: clicktoship-session
      description: Same-origin Sanctum session. Obtain XSRF cookie via GET /sanctum/csrf-cookie before mutations. Cookie name
        is deployment configurable.
    CsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie; mandatory for session mutations.
    BearerAuth:
      type: http
      scheme: bearer
      description: Hashed, expiring Sanctum API token, bound to one merchant and intersected with current membership permissions.
