            maxLength: 100
          - type: 'null'
        postal_code: &id018
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
        line1: &id019
          type: string
          maxLength: 200
        line2: &id020
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
