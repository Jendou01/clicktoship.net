    PricingEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        actor_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        action:
          enum:
          - draft
          - publish
          - disable
        access_grant:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
      - id
      - definition_id
      - version
      - actor_id
      - session_id
      - action
      - access_grant
      - created_at
    PricingVersion:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        configuration:
          type: object
        currency:
          type:
          - string
          - 'null'
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: clicktoship-session
      description: Same-origin Sanctum session. Obtain XSRF cookie via GET /sanctum/csrf-cookie before mutations. Cookie name
        is deployment configurable.
    CsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie; mandatory for session mutations.
    BearerAuth:
      type: http
      scheme: bearer
      description: Hashed, expiring Sanctum API token, bound to one merchant and intersected with current membership permissions.
