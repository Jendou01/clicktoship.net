        cod_minor:
          const: '0'
        declared_value_minor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})$
        goods_origin_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
        items:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 100000
              value_minor:
                type: string
                pattern: ^(0|[1-9][0-9]{0,11})$
              country:
                type: string
                pattern: ^[A-Z]{2}$
