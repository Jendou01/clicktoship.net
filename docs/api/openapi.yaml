openapi: 3.1.0
info:
  title: ClickToShip API — Phases 1–10
  version: 0.10.0
  description: Implemented identity, strict merchant tenancy, profiles/addresses, manual business verification, invitations,
    MFA, approved session-bound administration, private bounded bulk import preparation and gated shipment management. Live shipping and real charges remain disabled.
paths:
  /api/v1/health/live:
    get:
      operationId: healthLive
      summary: Process liveness, independent of database and Redis
      security: []
      responses:
        '200':
          description: API process is live
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '429':
          $ref: '#/components/responses/Throttled'
  /api/v1/health/ready:
    get:
      operationId: healthReady
      summary: PostgreSQL, Redis and current migration readiness
      security: []
      responses:
        '200':
          description: All required dependencies and migrations are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A required dependency or migration is unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessError'
        '429':
          $ref: '#/components/responses/Throttled'
  /api/v1/auth/register:
    post:
      summary: Register a global identity and optional owned organization
      operationId: postAuthRegister
      security:
      - SessionCookie: []
        CsrfToken: []
      description: CSRF-protected first-party session only. Returns unverified identity; enqueues encrypted verification notification.
        No default platform grants.
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login:
    post:
      summary: Log in and rotate session
      operationId: postAuthLogin
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Case-normalized email; account suspension checked. Five attempts/minute per identity+IP, 20/IP. No remember-me
        session.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      summary: Invalidate current browser session or current bearer token
      operationId: postAuthLogout
      security:
      - SessionCookie: []
        CsrfToken: []
      - BearerAuth: []
      description: ''
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logged_out: &id001
                        type: boolean
                    required:
                    - logged_out
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/me:
    get:
      summary: Read authenticated identity
      operationId: getAuthMe
      security:
      - SessionCookie: []
      - BearerAuth: []
      description: ''
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      summary: Patch auth me
      operationId: phase3PatchAuthMe
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Verified active identity required. Server-side permission checks and optimistic versions apply. Merchant
        IDs never override authenticated context. Responses are no-store. Browser session and CSRF required for mutations;
        bearer-only access is denied.
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: &id006
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      active_merchant_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                    required:
                    - user
                    - active_merchant_id
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
  /api/v1/auth/password/forgot:
    post:
      summary: Request recovery without exposing account existence
      operationId: postAuthPasswordForgot
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Same public response for unknown/suspended identities. Reset hashes stored in PostgreSQL; notification
        encrypted in Redis. Development mail captured by Mailpit, never logs.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: &id002
                        type: string
                    required:
                    - message
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
  /api/v1/auth/password/reset:
    post:
      summary: Consume reset token and revoke all credentials
      operationId: postAuthPasswordReset
      security:
      - SessionCookie: []
        CsrfToken: []
      description: 60-minute expiry. Single-use transaction locks reset row; updates password/auth version and revokes every
        session/token. Does not implicitly verify email.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      password_reset: *id001
                    required:
                    - password_reset
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
  /api/v1/auth/email/resend:
    post:
      summary: Resend verification email
      operationId: postAuthEmailResend
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Rate limited; no link or credential in response.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: *id002
                    required:
                    - message
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/email/verify:
    post:
      summary: Verify own email using signed link body
      operationId: postAuthEmailVerify
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Notification URL uses browser fragment; verification material is POSTed in JSON, never requested as a query
        URL. Signature, expiry, user ID and email hash checked.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      email_verified: *id001
                    required:
                    - email_verified
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
  /api/v1/auth/sessions:
    get:
      summary: List own active sessions
      operationId: getAuthSessions
      security:
      - SessionCookie: []
      description: Opaque registry UUIDs only, never Redis session IDs/hashes. Idle and absolute expiry enforced.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                    required:
                    - sessions
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/sessions/{session}:
    delete:
      summary: Revoke own session
      operationId: deleteAuthSessionsSession
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Current session revocation logs out; foreign user IDs return 404.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: *id001
                    required:
                    - revoked
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: session
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
  /api/v1/auth/memberships:
    get:
      summary: List authorized merchant memberships
      operationId: getAuthMemberships
      security:
      - SessionCookie: []
      - BearerAuth: []
      description: Alias of GET /merchants. Bearer clients only see the bound merchant.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/merchants:
    get:
      summary: List authorized merchant organizations
      operationId: getMerchants
      security:
      - SessionCookie: []
      - BearerAuth: []
      description: Verified email required. Session sees active own memberships, maximum 100; bearer sees only bound merchant.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      summary: Create an organization with owner membership
      operationId: postMerchants
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Verified email required. Caller becomes merchant owner, never platform administrator.
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      merchant:
                        $ref: '#/components/schemas/Merchant'
                    required:
                    - merchant
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRequest'
  /api/v1/merchants/select:
    post:
      summary: Switch active merchant for this session
      operationId: postMerchantsSelect
      security:
      - SessionCookie: []
        CsrfToken: []
      description: Verified, active membership required. Other browser sessions are unchanged. Tokens cannot switch. Selection
        audited.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active_merchant_id: *id003
                    required:
                    - active_merchant_id
                  meta:
                    $ref: '#/components/schemas/Meta'
                  error:
                    type: 'null'
                required:
                - data
                - meta
                - error
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectMerchantRequest'
  /api/v1/merchants/current:
    get:
      summary: Read current authorized merchant
      operationId: getMerchantsCurrent
      security:
      - SessionCookie: []
      - BearerAuth: []
      description: ' Requires merchant.view from current membership intersected with token abilities.'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMerchantResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: X-Merchant-ID
        in: header
        required: false
