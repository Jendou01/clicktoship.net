      - label
      - contact_name
      - contact_phone
      - country
      - city
      - line1
      allOf:
      - if:
          properties:
            country:
              const: SA
        then:
          required:
          - postal_code
          properties:
            postal_code:
              type: string
              pattern: ^[0-9]{5}$
      - if:
          properties:
            country:
              const: US
        then:
          required:
          - postal_code
          - region
          properties:
            postal_code:
              type: string
              pattern: ^[0-9]{5}(-[0-9]{4})?$
            region:
              type: string
              minLength: 1
              maxLength: 100
