  /sanctum/csrf-cookie:
    get:
      summary: Initialize first-party browser session and XSRF cookie
      operationId: csrfCookie
      security: []
      description: Call on the same origin before browser mutations. Send credentials and X-XSRF-TOKEN thereafter. Does not
