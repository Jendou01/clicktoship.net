name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: clicktoship
          POSTGRES_DB: clicktoship_test
          # Only this ephemeral CI service, bound to runner loopback. No real credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clicktoship -d clicktoship_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-bookworm
        ports: ["127.0.0.1:6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - name: Build PHP runtime
        run: docker build -f infrastructure/docker/api.Dockerfile -t clicktoship-api:ci .
      - name: Install, validate, lint and test on PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          api() {
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -e DB_HOST=127.0.0.1 -e REDIS_HOST=127.0.0.1 -e DB_PASSWORD= \
              -v "$PWD/apps/api:/app" clicktoship-api:ci "$@"
          }
          cp apps/api/.env.example apps/api/.env
          api composer install --no-interaction --prefer-dist
          api composer validate --strict
          api php artisan key:generate --no-interaction
          api vendor/bin/pint --test
          api php artisan test
          api composer audit
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified tag
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate separate demo Compose policy without starting services
        run: python3 scripts/demo/check_compose.py
      - name: Verify demo review signatures and tamper rejection using ephemeral keys
        run: python3 scripts/demo/test_review_crypto.py
      - run: python3 scripts/qa/audit_repository.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified tag
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://127.0.0.1:8080
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified tag
        with:
          node-version: '24'
          cache: npm
      - name: Prepare isolated full stack
        run: |
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          ./scripts/setup.sh
          ./scripts/prepare-browser-tests.sh
      - run: npx --workspace=@clicktoship/web playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified tag
        if: failure()
        with:
          name: full-stack-browser-results
          path: apps/web/test-results
          retention-days: 7
      - if: always()
        run: docker compose down

  demo-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/cts-demo-playwright
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare ephemeral Linux browser tooling only
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          npx --workspace=@clicktoship/web playwright install --with-deps chromium
          # Disposable hosted CI VM only. Never run this setup on the target VPS.
          sudo swapoff -a
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build tracked-source demo images and a private local archive
        run: |
          sudo --preserve-env=PATH,GITHUB_ACTIONS,PLAYWRIGHT_BROWSERS_PATH python3 scripts/demo/integration.py \
            --build-only --directory /tmp/cts-demo-ci
      - name: Exercise private demo lifecycle, accounts and teardown isolation
        run: |
          sudo --preserve-env=PATH,GITHUB_ACTIONS,PLAYWRIGHT_BROWSERS_PATH python3 scripts/demo/integration.py \
            --directory /tmp/cts-demo-ci --output /tmp/cts-demo-ci-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: disposable-demo-lifecycle-evidence
          path: /tmp/cts-demo-ci-evidence.json
          retention-days: 7
      # No images, keys, mail, fixture credentials, traces or raw logs uploaded.
